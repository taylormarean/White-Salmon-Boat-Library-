name = "next-chapter"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# The web app (frontend/dist) is served from this same Worker, so there's one address for everything.
[assets]
directory = "../frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[triggers]
# Hourly: send approved messages (business hours only), check Gmail for replies,
# schedule follow-ups. Once a day (her chosen hour): job search + morning summary.
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "next-chapter-db"
database_id = "PASTE_YOUR_D1_ID_HERE"   # `npm run setup` fills this in

[vars]
AI_MODEL = "claude-opus-5-5"
TIMEZONE = "America/Los_Angeles"

# Secrets — `npm run setup` asks for these and stores them with `wrangler secret put`:
#   ANTHROPIC_API_KEY     your Claude API key
#   GOOGLE_CLIENT_ID      Google sign-in + Gmail (see README step 2)
#   GOOGLE_CLIENT_SECRET
#   ALLOWED_EMAILS        "mom@gmail.com, you@gmail.com" — the first one is the job seeker
#   JWT_SECRET            generated automatically
#   TOKEN_ENC_KEY         generated automatically
#   ADZUNA_APP_ID / ADZUNA_APP_KEY / USAJOBS_API_KEY / USAJOBS_EMAIL   optional extra local job sources
