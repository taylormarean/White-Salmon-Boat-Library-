name = "next-chapter-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
# Hourly: send approved messages (business hours only), check Gmail for replies,
# schedule follow-ups. Once a day (prefs.daily_hour, local time): search + score.
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "next-chapter-db"
database_id = "PASTE_YOUR_D1_ID_HERE"

[vars]
FRONTEND_URL = "http://localhost:5173"   # where the web app lives (Gmail redirects back here)
API_URL = "http://localhost:8787"        # this Worker's public URL (Gmail OAuth callback)
AI_MODEL = "claude-opus-5-5"
TIMEZONE = "America/Los_Angeles"

# Secrets (wrangler secret put NAME):
#   JWT_SECRET            required — any long random string (login tokens)
#   TOKEN_ENC_KEY         required — any long random string (encrypts the Gmail token at rest)
#   ANTHROPIC_API_KEY     required — Claude API key (console.anthropic.com)
#   GOOGLE_CLIENT_ID      optional — Gmail sending + reply tracking (see README)
#   GOOGLE_CLIENT_SECRET  optional
#   ADZUNA_APP_ID         optional — local job search (developer.adzuna.com, free)
#   ADZUNA_APP_KEY        optional
#   USAJOBS_API_KEY       optional — government jobs near her (developer.usajobs.gov, free)
#   USAJOBS_EMAIL         optional — the email you registered the USAJobs key with
#   MOCK_AI               dev only — "1" returns canned AI output, no API calls
