name: Deploy demo to GitHub Pages

# Publishes the client demo with zero external accounts:
#   /        -> marketing site
#   /app/    -> the app in demo mode (in-browser backend, seeded data)
#   /guide.html -> the user guide
# Publishes to the gh-pages branch, which GitHub serves via Pages.
on:
  push:
    branches: ["claude/white-salmon-boat-library-1gxtkt"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build app in demo mode
        working-directory: frontend
        env:
          VITE_DEMO: "1"
        run: |
          npm ci
          npx tsc
          npx vite build --base=./
      - name: Assemble pages bundle
        run: |
          mkdir -p _site/app
          cp site/index.html _site/index.html
          cp docs/user-guide.html _site/guide.html
          cp -r frontend/dist/. _site/app/
          touch _site/.nojekyll
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          force_orphan: true
