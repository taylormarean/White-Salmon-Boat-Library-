name: Deploy demo to GitHub Pages

# Publishes the client demo with zero external accounts:
#   /        -> marketing site
#   /app/    -> the app in demo mode (in-browser backend, seeded data)
#   /guide.html -> the user guide
on:
  push:
    branches: ["claude/white-salmon-boat-library-1gxtkt"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build app in demo mode
        working-directory: frontend
        env:
          VITE_DEMO: "1"
        run: |
          npm ci
          npx tsc
          npx vite build --base=./
      - name: Assemble pages bundle
        run: |
          mkdir -p _site/app
          cp site/index.html _site/index.html
          cp docs/user-guide.html _site/guide.html
          cp -r frontend/dist/. _site/app/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
